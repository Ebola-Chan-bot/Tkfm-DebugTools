<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#126b60">
  <meta name="description" content="颠倒镜与魔狱塔55夏日尾声战斗模拟器">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./镜面-192.png">
  <link rel="apple-touch-icon" href="./镜面-192.png">
  <link rel="stylesheet" href="./界面.css">
  <title>TKFM · 战斗模拟器</title>
</head>
<body>
  <header class="顶栏">
    <div class="品牌"><img id="品牌图" src="./镜面-192.png" width="36" height="36" alt=""><div><h1>战斗模拟器</h1><span>TKFM <b id="关卡简称">SP-4</b></span></div></div>
    <div class="顶栏工具">
      <span id="离线状态" class="状态签">本地存档</span>
      <button id="安装" class="图标按钮" title="安装应用" aria-label="安装应用" hidden><i data-lucide="monitor-down"></i></button>
      <button id="导入" class="图标按钮" title="导入战斗记录" aria-label="导入战斗记录"><i data-lucide="upload"></i></button>
      <button id="导出" class="图标按钮" title="导出战斗记录" aria-label="导出战斗记录"><i data-lucide="download"></i></button>
      <button id="重置" class="图标按钮" title="重置战斗" aria-label="重置战斗"><i data-lucide="rotate-ccw"></i></button>
    </div>
  </header>
  <main>
    <div class="关卡栏"><label for="关卡选择">关卡</label><select id="关卡选择"><option value="颠倒镜">颠倒镜 · SP-4</option><option value="夏日尾声">魔狱塔-55 · 夏日尾声</option></select><span id="关卡编号" class="弱文字"></span></div>
    <nav class="页签" aria-label="模拟器视图">
      <button data-tab="战场" aria-selected="true"><i data-lucide="swords"></i>战场</button>
      <button data-tab="编队" aria-selected="false"><i data-lucide="users-round"></i>编队</button>
      <button data-tab="模型" aria-selected="false"><i data-lucide="sliders-horizontal"></i>战斗设置</button>
      <button data-tab="记录" aria-selected="false"><i data-lucide="list-tree"></i>战斗记录</button>
    </nav>
    <section data-view="战场">
      <div class="首领带">
        <img class="镜面" src="./镜面-512.png" width="112" height="112" alt="颠倒镜">
        <div class="首领主体"><div class="首领标题"><div><span id="关卡标签" class="小标签">时之裂缝 · 第 27 季</span><h2 id="关卡名称">颠倒镜</h2></div><span id="回合" class="回合数">01 <small>回合</small></span></div><div class="血量标题"><span id="首领生命"></span><span id="首领比例"></span></div><div class="生命轨 首领生命轨"><div id="首领生命条"></div></div><div id="首领状态" class="首领状态"></div></div>
      </div>
      <div id="多敌区域" hidden><div class="段标题"><h2>敌方队伍<span id="当前目标" class="阶段签"></span></h2></div><div id="敌方队伍" class="敌方网格" role="group" aria-label="攻击目标"></div></div>
      <div class="统计带" aria-label="本场统计"><div><span>累计造成伤害</span><strong id="总伤害">0</strong></div><div><span>本回合有效回复</span><strong id="本回合回复">0</strong></div><div><span>本回合承伤</span><strong id="本回合承伤">0</strong></div><div><span>存活角色</span><strong id="存活">5 <small>/ 5</small></strong></div></div>
      <div class="段标题"><h2>我方行动<span id="阶段" class="阶段签">我方</span></h2><div class="操作组"><button id="撤销" class="图标按钮" title="撤销上一步" aria-label="撤销上一步"><i data-lucide="undo-2"></i></button><button id="重做" class="图标按钮" title="重做上一步" aria-label="重做上一步"><i data-lucide="redo-2"></i></button><span class="分隔"></span><button id="一回合" class="次按钮"><i data-lucide="fast-forward"></i>本回合</button></div></div>
      <div id="角色队伍" class="角色网格"></div>
      <div id="结局" class="结局" hidden></div>
      <div id="旧记录栏" class="校准栏" hidden><strong>此记录需重新开始</strong><button id="启用自动" class="次按钮"><i data-lucide="rotate-ccw"></i>重新开始</button></div>
      <div class="段标题"><h2>敌方行动</h2><button id="整场运行" class="次按钮"><i data-lucide="play"></i>运行至结束</button></div><div id="AI预览" class="技能目录"></div>
      <div class="段标题"><h2>最近行动</h2><button class="文字按钮" data-open-tab="记录">完整记录<i data-lucide="arrow-right"></i></button></div>
      <div class="表格区"><table class="日志表"><thead><tr><th>回合</th><th>事件</th><th>结算</th><th class="数值列">数值</th></tr></thead><tbody id="最近日志"></tbody></table></div>
    </section>
    <section data-view="编队" hidden>
      <div class="段标题"><h2>编队<small id="角色目录数量"></small></h2><div class="操作组 编队操作"><button id="添加角色" class="次按钮"><i data-lucide="user-plus"></i>添加角色</button><button id="导出编队" class="次按钮"><i data-lucide="download"></i>导出编队</button><button id="载入编队" class="次按钮"><i data-lucide="folder-open"></i>载入编队</button><button id="导出旧记录" class="次按钮" hidden><i data-lucide="download"></i>导出原记录</button><button id="应用编队" class="主按钮"><i data-lucide="check"></i>应用编队</button></div></div>
      <template id="编队表头模板"><div class="编队表头"><span>站位 / 角色</span><span>普通等级</span><span>ELV突破</span><span>羁绊</span><span>星级</span><span>调教</span><span>解放</span><span>生命</span><span>攻击</span><span>顺序</span></div></template><div id="编队表"></div><datalist id="角色候选"></datalist>
    </section>
    <section data-view="模型" hidden>
      <form id="模型表单">
        <div class="段标题"><h2>战斗设置</h2><button type="submit" class="主按钮"><i data-lucide="check"></i>应用并重新开始</button></div>
        <div class="设置网格">
          <label>首领生命<input name="首领生命" type="number" min="1" step="1" required></label>
          <label>首领攻击<input name="首领攻击" type="number" min="1" step="1" required></label>
          <label>回合上限<input name="回合上限" type="number" min="1" max="100" required></label>
        </div>
        <div id="夏日面板区域" hidden><div class="段标题"><h2>敌方属性</h2></div><div id="敌方面板" class="敌方面板"></div></div>
        <div class="段标题"><h2>敌方技能</h2></div><div id="技能目录" class="技能目录"></div>
      </form>
    </section>
    <section data-view="记录" hidden>
      <div class="段标题"><h2>回合报表</h2><button id="导出报表" class="次按钮"><i data-lucide="sheet"></i>导出 CSV</button></div>
      <div class="表格区"><table><thead><tr><th>回合</th><th>敌方技能</th><th>伤害</th><th>有效回复</th><th>理论回复</th><th>护盾生成</th><th>护盾吸收</th><th>承伤</th><th>存活</th></tr></thead><tbody id="报表"></tbody></table></div>
      <div class="段标题"><h2>行动记录</h2><label class="内联标签">类别<select id="日志类别"><option value="">全部</option><option>行动</option><option>伤害</option><option>治疗</option><option>护盾</option><option>触发</option><option>机制</option><option>敌方</option><option>承伤</option><option>倒下</option></select></label></div>
      <div class="表格区"><table class="日志表"><thead><tr><th>回合</th><th>事件</th><th>结算</th><th class="数值列">数值</th></tr></thead><tbody id="全部日志"></tbody></table></div>
    </section>
    <footer><span>TKFM 战斗模拟器</span><span id="保存状态">已保存</span></footer>
  </main>
  <input id="导入文件" type="file" accept=".json,application/json" hidden>
  <input id="编队文件" type="file" accept=".json,application/json" hidden>
  <div id="通知" role="status" aria-live="polite" hidden></div>
  <dialog id="详情弹窗"><div class="弹窗标题"><h2 id="详情标题">角色状态</h2><button class="图标按钮" data-close title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="详情正文"></div></dialog>
  <script src="./图标.js"></script>
  <script type="module" src="./应用.mjs"></script>
</body>
</html>
